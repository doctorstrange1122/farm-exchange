<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="农场兑换">
    <meta name="theme-color" content="#6a9a7a">
    <title>农场兑换</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e8edf2 0%, #d3dde6 50%, #c2cfd9 100%);
            min-height: 100vh;
            padding: 16px;
            color: #3a4a5a;
        }
        .wrapper { max-width: 480px; margin: 0 auto; }

        /* 顶部 Tab */
        .tab-bar {
            display: flex;
            background: #fdfdfe;
            border-radius: 14px;
            padding: 4px;
            box-shadow: 0 4px 20px rgba(120,140,160,0.1);
            margin-bottom: 14px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 8px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            background: transparent;
            color: #8a9bad;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #7a93ac, #6b82a0);
            color: #fff;
            box-shadow: 0 2px 8px rgba(110,130,160,0.25);
        }

        /* 权限提示 */
        .permission-tip {
            background: #eaf0f6;
            border: 1px solid #c5d2de;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 14px;
            font-size: 13px;
            color: #5a7a96;
            text-align: left;
        }

        /* 卡片通用 */
        .card {
            background: #fdfdfe;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(120,140,160,0.1);
            margin-bottom: 14px;
        }
        .card-title {
            font-size: 15px; font-weight: 600; color: #6b7f92;
            margin-bottom: 14px; display: flex; align-items: center; gap: 6px;
        }
        .card-title::before { content: ""; width: 4px; height: 16px; background: #8ba0b5; border-radius: 2px; }

        /* 输入区 */
        .input-section { margin-bottom: 14px; }
        .input-section:last-child { margin-bottom: 0; }
        .input-section label {
            display: block; font-size: 14px; font-weight: 600;
            color: #4a5c6e; margin-bottom: 6px;
        }
        .input-section input, .input-section textarea {
            width: 100%;
            padding: 12px 14px; font-size: 16px;
            border: 2px solid #dde3ea; border-radius: 10px;
            transition: border-color 0.2s;
            -webkit-appearance: none;
            font-family: inherit;
            background: #fff;
            color: #3a4a5a;
            word-break: break-all;
        }
        .input-section textarea { resize: none; line-height: 1.5; }
        .input-section input:focus, .input-section textarea:focus { outline: none; border-color: #8ba0b5; }
        .input-section input::placeholder, .input-section textarea::placeholder { color: #b0bcc8; }
        .input-row { display: flex; gap: 6px; align-items: stretch; }
        .input-row input { flex: 1; }
        .clear-button, .paste-button, .scan-button {
            padding: 8px 6px; font-size: 12px; font-weight: 600;
            border: none; border-radius: 8px; cursor: pointer;
            white-space: nowrap; flex-shrink: 0;
        }
        .clear-button { background: #eef2f6; color: #7a8b9c; }
        .clear-button:active { background: #e0e6ec; }
        .paste-button { background: #d4e4f0; color: #4a7a9a; }
        .paste-button:active { background: #c4d4e0; }
        .scan-button { background: #6a9a7a; color: #fff; }
        .scan-button:active { background: #5a8a6a; }

        .tip-text { font-size: 13px; color: #d4884a; font-weight: 500; margin-top: 6px; }

        /* 生成按钮 */
        .button-group { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .button-group button {
            width: 100%; max-width: 320px;
            padding: 14px 20px; font-size: 16px; font-weight: 600;
            border: none; border-radius: 12px; cursor: pointer;
            background: linear-gradient(135deg, #7a93ac, #6b82a0);
            color: #fff;
            box-shadow: 0 4px 14px rgba(110,130,160,0.25);
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .button-group button:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(110,130,160,0.25); }
        .button-group button:disabled {
            background: #b0bcc8;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* 结果区 */
        #resultArea { margin-top: 0; margin-bottom: 18px; }
        .result-card { text-align: center; }
        .result-card img {
            border-radius: 12px; box-shadow: 0 4px 16px rgba(120,140,160,0.12);
            margin: 10px 0;
        }
        .long-press-tip {
            display: inline-block;
            background: #eef6ff;
            border: 1px solid #b3d0f0;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            color: #2c6cb5;
            font-weight: 600;
            margin: 4px 0 12px;
        }
        .copy-success-inline {
            color: #6a9a7a; font-size: 13px; font-weight: 600;
            display: block; margin: 8px 0;
        }

        /* 扫码弹窗 */
        .scan-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .scan-modal.active { display: flex; }
        .scan-close {
            position: absolute; top: 20px; right: 20px; width: 40px; height: 40px;
            background: rgba(255,255,255,0.2); border: none; border-radius: 50%;
            color: #fff; font-size: 20px; cursor: pointer; line-height: 40px; text-align: center;
        }
        .scan-close:active { background: rgba(255,255,255,0.4); }
        .scan-viewport {
            width: 280px; height: 280px; border-radius: 16px; overflow: hidden;
            border: 3px solid #6a9a7a; position: relative;
        }
        .scan-viewport video { width: 100%; height: 100%; object-fit: cover; }
        .scan-hint { color: #fff; font-size: 14px; margin-top: 16px; text-align: center; }

        /* 历史记录 */
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-item {
            background: #f4f7fa;
            border: 1px solid #e3e9ef;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.5;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .history-item .history-left {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            flex-shrink: 0;
            width: 90px;
        }
        .history-item .history-date {
            color: #8a9bad; font-weight: 600;
            flex-shrink: 0;
            font-size: 12px;
            line-height: 1.5;
        }
        .history-item .history-text {
            color: #4a5c6e; font-weight: 600;
            font-size: 12px;
            line-height: 1.5;
            word-break: break-all;
            flex: 1; min-width: 0;
        }
        .history-item .history-right {
            flex: 1; min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .history-item .history-title {
            color: #3a4a5a; font-weight: 600;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-all;
        }
        .history-item .history-link {
            color: #2c6cb5;
            cursor: pointer; text-decoration: underline;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 12px;
            line-height: 1.4;
        }
        .history-item .history-link:active { color: #1a5a9e; }
        .history-item .history-actions {
            display: flex;
            flex-direction: row;
            gap: 6px;
            flex-shrink: 0;
            align-items: center;
            align-self: flex-start;
        }
        .history-item .history-share, .history-item .history-delete {
            width: 24px; height: 24px;
            border: none; border-radius: 50%;
            font-size: 12px; line-height: 24px; text-align: center;
            cursor: pointer; padding: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .history-item .history-share { background: #d8e8f0; color: #2c6cb5; }
        .history-item .history-share:active { background: #c8d8e8; }
        .history-item .history-delete { background: #f0d8d8; color: #c05050; font-size: 14px; }
        .history-item .history-delete:active { background: #e8c8c8; }
        .history-empty { text-align: center; color: #9aa8b6; font-size: 13px; padding: 12px 0; }
        .history-clear-btn {
            width: 100%; max-width: 280px; margin: 12px auto 0;
            padding: 10px 16px; font-size: 14px; font-weight: 600;
            background: #eef2f6; color: #7a8b9c;
            border: none; border-radius: 8px; cursor: pointer;
            display: block;
        }
        .history-clear-btn:active { background: #e0e6ec; }
        .history-pagination {
            display: flex; align-items: center; justify-content: center;
            gap: 16px; margin-top: 14px;
        }
        .history-pagination button {
            padding: 8px 18px; font-size: 14px; font-weight: 600;
            background: #eef2f6; color: #5a6c7e;
            border: none; border-radius: 8px; cursor: pointer;
        }
        .history-pagination button:active { background: #e0e6ec; }
        .history-pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        .history-page-info { font-size: 13px; color: #6b7f92; font-weight: 600; min-width: 70px; text-align: center; }

        .footer { text-align: center; font-size: 11px; color: #9aa8b6; padding: 16px 0 8px; }
    </style>
</head>
<body>
<div class="wrapper">

    <!-- Tab 切换 -->
    <div class="tab-bar">
        <button class="tab-btn active" id="tabFarm" onclick="switchTab('farm')">🌾 农场兑换</button>
        <button class="tab-btn" id="tabCoin" onclick="switchTab('coin')">🪙 签到元宝</button>
    </div>

    <div class="permission-tip">🔔 为正常使用复制功能，请授予页面剪贴板访问权限</div>

    <!-- 输入卡片 -->
    <div class="card">
        <div class="card-title">输入信息</div>
        <div class="input-section">
            <label for="productLink">商品淘口令 / 分享文本</label>
            <div class="input-row">
                <input type="text" id="productLink" placeholder="粘贴淘口令或分享文本" required>
                <button class="scan-button" onclick="startScan()" title="扫码输入">扫码</button>
                <button class="paste-button" onclick="pasteFromClipboard()" title="粘贴剪贴板">粘贴</button>
                <button class="clear-button" onclick="clearInput()">清空</button>
            </div>
            <div class="tip-text">直接粘贴淘口令或分享文本，自动解析获取商品ID</div>
        </div>
        <!-- 农场兑换专属 -->
        <div id="farmExtra">
            <div class="input-section">
                <label for="replaceLink">替换链接（选填）</label>
                <input type="text" id="replaceLink" placeholder="留空使用默认链接">
            </div>
            <div class="input-section">
                <label for="customText">自定义文字（选填）</label>
                <input type="text" id="customText" placeholder="可输入备注信息，如商品名称、用途等">
                <div class="tip-text">自定义文字将显示在二维码上方，与二维码合并为一张图片</div>
            </div>
        </div>
    </div>

    <!-- 生成按钮 -->
    <div class="card">
        <div class="card-title">生成二维码</div>
        <div class="button-group">
            <button id="generateBtn" onclick="generateQRCode()">生成二维码</button>
        </div>
    </div>

    <!-- 结果区 -->
    <div id="resultArea"></div>

    <!-- 跳转淘宝 -->
    <div class="card" id="jumpCard" style="display:none;">
        <div class="button-group">
            <button id="jumpTaobaoBtn" onclick="jumpToTaobao()">跳转淘宝APP</button>
        </div>
    </div>

    <!-- 历史记录（农场兑换专属） -->
    <div class="card" id="historyCard">
        <div class="card-title">历史记录</div>
        <div id="historyList" class="history-list">
            <div class="history-empty">暂无历史记录</div>
        </div>
        <div class="history-pagination" id="historyPagination" style="display:none;">
            <button id="historyPrevBtn" onclick="changeHistoryPage(-1)">上一页</button>
            <span class="history-page-info" id="historyPageInfo"></span>
            <button id="historyNextBtn" onclick="changeHistoryPage(1)">下一页</button>
        </div>
        <button class="history-clear-btn" id="historyClearBtn" onclick="clearHistory()" style="display:none;">清空历史记录</button>
    </div>

    <div class="footer">农场兑换 · 签到元宝</div>
</div>

<!-- 扫码弹窗 -->
<div class="scan-modal" id="scanModal">
    <button class="scan-close" onclick="stopScan()">✕</button>
    <div class="scan-viewport" id="scanViewport"></div>
    <div class="scan-hint">将二维码对准框内，自动识别</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<script>
    // ====== Tab 切换 ======
    let currentTab = 'farm'; // 'farm' | 'coin'

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabFarm').classList.toggle('active', tab === 'farm');
        document.getElementById('tabCoin').classList.toggle('active', tab === 'coin');

        // 农场专属输入项
        document.getElementById('farmExtra').style.display = (tab === 'farm') ? '' : 'none';
        // 历史记录
        document.getElementById('historyCard').style.display = (tab === 'farm') ? '' : 'none';
        // 清空结果区
        document.getElementById('resultArea').innerHTML = '';
        document.getElementById('jumpCard').style.display = 'none';
    }

    // ====== 全局变量 ======
    let currentMergedImageDataURL = null;
    let lastCopiedLink = null;

    // ====== 从淘口令中提取商品标题 ======
    function extractProductTitle(text) {
        var cleaned = text.replace(/https?:\/\/\S+/g, '');
        var m = cleaned.match(/「(.*?)」/);
        if (m) {
            var title = m[1].trim();
            title = title.replace(/[【\[].*?[】\]]/g, '').trim();
            if (title && title.length >= 2) return title;
        }
        var matches = cleaned.match(/[【\[](.*?)[】\]]/g);
        if (matches) {
            for (var i = 0; i < matches.length; i++) {
                var t = matches[i].replace(/[【\[\]】]/g, '').trim();
                if (t === '淘宝' || t === '天猫' || t === '淘宝网' || t === '分享' || t === '复制') continue;
                if (t && t.length >= 2) return t;
            }
        }
        return null;
    }

    // ====== 清空输入框 ======
    function clearInput() {
        document.getElementById('productLink').value = '';
        if (currentTab === 'farm') {
            document.getElementById('customText').value = '';
        }
    }

    // ====== 粘贴剪贴板内容到输入框 ======
    function pasteFromClipboard() {
        const input = document.getElementById('productLink');
        if (window.NativeBridge && typeof NativeBridge.readClipboard === 'function') {
            NativeBridge.readClipboard();
            return;
        }
        if (navigator.clipboard && navigator.clipboard.readText) {
            navigator.clipboard.readText().then(function(text) {
                if (text && text.trim()) {
                    input.value = text.trim();
                    input.dispatchEvent(new Event('input'));
                } else {
                    alert('剪贴板为空');
                }
            }).catch(function() {
                input.focus();
                if (document.execCommand('paste')) {
                    input.dispatchEvent(new Event('input'));
                } else {
                    alert('请手动粘贴（长按输入框选择粘贴）');
                }
            });
        } else {
            input.focus();
            alert('请手动粘贴（长按输入框选择粘贴）');
        }
    }

    // ====== 扫码功能 ======
    let html5QrCode = null;

    async function startScan() {
        const modal = document.getElementById('scanModal');
        modal.classList.add('active');
        if (!window.Html5Qrcode) {
            try {
                await loadScript('https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js');
            } catch (e) {
                alert('扫码组件加载失败，请手动粘贴淘口令');
                stopScan();
                return;
            }
        }
        if (!html5QrCode) html5QrCode = new Html5Qrcode('scanViewport');
        try {
            await html5QrCode.start(
                { facingMode: 'environment' },
                { fps: 10, qrbox: { width: 220, height: 220 } },
                (decodedText) => { document.getElementById('productLink').value = decodedText; stopScan(); },
                () => {}
            );
        } catch (err) {
            console.error('扫码启动失败:', err);
            alert('无法打开相机，请检查相机权限。也可以手动粘贴淘口令。');
            stopScan();
        }
    }

    async function stopScan() {
        document.getElementById('scanModal').classList.remove('active');
        if (html5QrCode && html5QrCode.isScanning) {
            try { await html5QrCode.stop(); } catch (e) { console.warn('停止扫码异常:', e); }
        }
    }

    function loadScript(src) {
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = src;
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
        });
    }

    // ====== CORS 代理列表（并行竞争，谁先返回用谁） ======
    const CORS_PROXIES = [
        (url) => `https://proxy.cors.sh/${url}`,
        (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
        (url) => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
        (url) => `https://crossorigin.me/${url}`,
        (url) => `https://cors-proxy.htmldriven.com/?url=${encodeURIComponent(url)}`,
        (url) => `https://cors.x2u.in/${url}`,
        (url) => `https://whateverorigin.org/get?url=${encodeURIComponent(url)}`,
    ];

    function extractShortUrl(text) {
        const m = text.match(/https?:\/\/[^\s，。￥¥₳【】\]\[]+/);
        return m ? m[0] : null;
    }

    // 从 URL 中提取商品ID（零网络，毫秒级）
    function extractItemIdFromUrl(url) {
        const m = url.match(/[?&]id=(\d{7,})/)          // id= 后至少7位数字
            || url.match(/topIds=(\d+)/)                 // 淘宝分享页的 topIds 参数
            || url.match(/itemIds=(\d+)/)
            || url.match(/\/i(\d+)\.htm/)
            || url.match(/\/(\d+)\.html?/);
        return m ? m[1] : null;
    }

    // 通过 CORS 代理请求 URL，并行竞争，3s 超时
    async function fetchWithProxy(targetUrl) {
        const promises = CORS_PROXIES.map((proxyFn) => {
            const proxyUrl = proxyFn(targetUrl);
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);
            return fetch(proxyUrl, { signal: controller.signal })
                .then(resp => {
                    clearTimeout(timeoutId);
                    if (resp.ok) return resp.text();
                    throw new Error('bad status');
                })
                .then(text => {
                    if (text && text.length > 50) return text;
                    throw new Error('too short');
                })
                .catch(e => { throw e; });
        });
        try {
            return await Promise.any(promises);
        } catch (e) {
            return null;
        }
    }

    // 通过短链直接跟随重定向获取最终URL（快路径，不走代理，2s 超时）
    async function resolveShortUrl(shortUrl) {
        // 方法1：标准 fetch + redirect follow
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2000);
            const resp = await fetch(shortUrl, {
                redirect: 'follow',
                signal: controller.signal,
            });
            clearTimeout(timeoutId);
            if (resp.url && resp.url !== shortUrl) {
                return resp.url;
            }
            // e.tb.cn 返回 200 HTML（不重定向），直接从 body 提取
            const body = await resp.text();
            if (body && body.length > 200) {
                const urlMatch = body.match(/var\s+url\s*=\s*'([^']+)'/);
                if (urlMatch) return urlMatch[1];
                const topMatch = body.match(/topIds=(\d+)/);
                if (topMatch) return 'https://item.taobao.com/item.htm?id=' + topMatch[1];
            }
        } catch (e) {
            console.warn('resolveShortUrl fetch failed:', e.message);
        }

        // 方法2：no-cors 模式
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2000);
            const resp = await fetch(shortUrl, {
                mode: 'no-cors',
                redirect: 'follow',
                signal: controller.signal,
            });
            clearTimeout(timeoutId);
            if (resp.url && resp.url !== shortUrl) {
                return resp.url;
            }
        } catch (e) {
            console.warn('resolveShortUrl no-cors failed:', e.message);
        }

        // 方法3：XMLHttpRequest 兜底
        return new Promise((resolve) => {
            const xhr = new XMLHttpRequest();
            xhr.timeout = 2000;
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.responseURL && xhr.responseURL !== shortUrl) {
                        resolve(xhr.responseURL);
                    } else {
                        resolve(null);
                    }
                }
            };
            xhr.onerror = () => resolve(null);
            xhr.ontimeout = () => resolve(null);
            xhr.open('HEAD', shortUrl, true);
            xhr.send();
        });
    }

    // 通过淘口令/分享文本解析获取商品ID（快路径+慢路径并行）
    async function parseItemIdFromShareText(text) {
        // 0. 极速路径：输入本身包含商品链接，直接本地提取（零网络）
        const directId = extractItemIdFromUrl(text);
        if (directId) return directId;

        // 1. 提取短链
        let shortUrl = extractShortUrl(text);
        if (!shortUrl) {
            const token = text.replace(/[^\w]/g, '');
            if (!token) return null;
            shortUrl = `https://m.tb.cn/h.${token}`;
        }
        console.log('解析短链:', shortUrl);

        // 2. 快路径+慢路径并行：同时发起重定向跟踪和代理请求，取最快结果
        const results = await Promise.allSettled([
            // 快路径：直接跟随重定向（2s 超时）
            (async () => {
                const resolvedUrl = await resolveShortUrl(shortUrl);
                console.log('重定向结果:', resolvedUrl);
                if (resolvedUrl) return extractItemIdFromUrl(resolvedUrl);
                return null;
            })(),
            // 慢路径：CORS 代理获取完整 HTML（3s 超时 × 8个代理并行）
            (async () => {
                const body = await fetchWithProxy(shortUrl);
                console.log('代理结果长度:', body ? body.length : 0);
                if (!body) return null;
                const urlMatch = body.match(/var\s+url\s*=\s*'([^']+)'/);
                if (urlMatch) {
                    const id = extractItemIdFromUrl(urlMatch[1]);
                    if (id) return id;
                }
                const m = body.match(/topIds=(\d+)/) || body.match(/itemIds=(\d+)/) || body.match(/[?&]id=(\d{7,})/);
                return m ? m[1] : null;
            })(),
        ]);

        // 取最先成功的有效结果
        for (const r of results) {
            if (r.status === 'fulfilled' && r.value) return r.value;
        }
        console.error('所有解析路径均失败');
        return null;
    }

    // 本地提取商品ID（兜底，零网络 — 保留原宽松逻辑）
    function extractProductId(productLink) {
        const itemIdsMatch = productLink.match(/itemIds=(\d+)/);
        if (itemIdsMatch) return itemIdsMatch[1];
        const idMatch = productLink.match(/id=(\d+)/);
        if (idMatch) return idMatch[1];
        const iMatch = productLink.match(/\/i(\d+)\.htm/);
        if (iMatch) return iMatch[1];
        const numberMatch = productLink.match(/\/(\d+)\.html?/);
        if (numberMatch) return numberMatch[1];
        return null;
    }

    // ====== 替换链接中的商品ID ======
    function replaceFarmItemId(link, newItemId) {
        if (/index\?id=\d+/.test(link)) {
            return link.replace(/(index\?id=)\d+/, `$1${newItemId}`);
        }
        return null;
    }

    function replaceCoinItemId(link, newItemId) {
        if (/itemIds=/.test(link)) {
            return link.replace(/(itemIds=)\d*/, `$1${newItemId}`);
        }
        return null;
    }

    // ====== 跳转淘宝APP（兼容 Android / iOS / 鸿蒙系统） ======
    function openTaobaoApp(url) {
        // tbopen:// 是淘宝官方 Deep Link，鸿蒙系统兼容性最好
        const tbopenUrl = `tbopen://m.taobao.com/tbopen/index.html?action=ali.open.nav&h5Url=${encodeURIComponent(url)}`;
        // taobao:// 作为备用 scheme
        const taobaoScheme = `taobao://${url.replace('https://', '')}`;

        let appOpened = false;
        const visibilityHandler = function() {
            if (document.hidden) { appOpened = true; }
        };
        document.addEventListener('visibilitychange', visibilityHandler);

        function tryScheme(schemeUrl) {
            if (window.NativeBridge || (window.Android && typeof window.Android !== 'undefined')) {
                window.location.href = schemeUrl;
            } else {
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = schemeUrl;
                document.body.appendChild(iframe);
                setTimeout(function() {
                    if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
                }, 3000);
            }
        }

        tryScheme(tbopenUrl);

        setTimeout(function() {
            if (appOpened) {
                document.removeEventListener('visibilitychange', visibilityHandler);
                return;
            }
            tryScheme(taobaoScheme);
        }, 1000);
    }

    function jumpToTaobao() {
        if (!lastCopiedLink) {
            alert('请先生成二维码或复制链接');
            return;
        }
        openTaobaoApp(lastCopiedLink);
    }

    // ====== 复制到剪贴板 ======
    function copyToClipboard(text) {
        // 优先使用 Android 原生桥接（WebView 中最可靠）
        if (window.NativeBridge && typeof NativeBridge.copyToClipboard === 'function') {
            NativeBridge.copyToClipboard(text);
            return;
        }
        // 退回到浏览器 API
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).catch(() => { _copyFallback(text); });
        } else {
            _copyFallback(text);
        }
    }

    function _copyFallback(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.top = '0'; textarea.style.left = '0';
        textarea.style.width = '1px'; textarea.style.height = '1px';
        textarea.style.opacity = '0';
        textarea.setAttribute('readonly', '');
        document.body.appendChild(textarea);
        const range = document.createRange();
        range.selectNodeContents(textarea);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        textarea.setSelectionRange(0, text.length);
        try { document.execCommand('copy'); } catch (e) { console.error('复制失败:', e); }
        selection.removeAllRanges();
        document.body.removeChild(textarea);
    }

    // ====== 系统分享 ======
    function shareContent(title, link) {
        const shareText = title + '\n\n' + link;
        if (navigator.share) {
            navigator.share({ title: title, text: shareText }).catch(() => {
                copyToClipboard(shareText);
                alert('已复制分享内容到剪贴板');
            });
        } else {
            copyToClipboard(shareText);
            alert('已复制分享内容到剪贴板');
        }
    }

    // ====== 获取当天日期字符串 ======
    function getTodayDateStr() {
        const now = new Date();
        return `${now.getMonth() + 1}.${now.getDate()}`;
    }

    // ====== 创建二维码图片（农场模式：日期+自定义文字） ======
    function createFarmQRCode(qrCodeDataURL, customText) {
        return new Promise((resolve) => {
            const qrCodeImg = new Image();
            qrCodeImg.src = qrCodeDataURL;
            qrCodeImg.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const qrSize = 240, padding = 16, fontSize = 20;
                const lineHeight = fontSize + 6, maxCharsPerLine = 14;
                const dateStr = getTodayDateStr();
                let headerText = dateStr;
                if (customText) headerText = `${dateStr}  ${customText}`;
                let lines = [], currentLine = '';
                for (let i = 0; i < headerText.length; i++) {
                    currentLine += headerText[i];
                    if (currentLine.length >= maxCharsPerLine || i === headerText.length - 1) {
                        lines.push(currentLine);
                        currentLine = '';
                    }
                }
                const textAreaHeight = lines.length * lineHeight + padding;
                canvas.width = qrSize + padding * 2;
                canvas.height = qrSize + textAreaHeight + padding;
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#333';
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                lines.forEach((line, index) => {
                    ctx.fillText(line, canvas.width / 2, padding + lineHeight * (index + 0.5));
                });
                ctx.drawImage(qrCodeImg, padding, textAreaHeight, qrSize, qrSize);
                resolve(canvas.toDataURL('image/png'));
            };
            qrCodeImg.onerror = function() { resolve(qrCodeDataURL); };
        });
    }

    // ====== 显示结果区（两个Tab共用） ======
    function showResult(productTitle, mergedDataURL) {
        const resultArea = document.getElementById('resultArea');
        const container = document.createElement('div');
        container.className = 'result-card';

        if (productTitle) {
            const titleEl = document.createElement('div');
            titleEl.style.cssText = 'font-size:14px;font-weight:600;color:#4a5c6e;margin-bottom:8px;';
            titleEl.textContent = '📦 ' + productTitle;
            container.appendChild(titleEl);
        }

        const img = document.createElement('img');
        img.src = mergedDataURL;
        img.alt = '生成的二维码';
        img.style.maxWidth = '280px';
        img.style.width = '100%';
        img.style.userSelect = 'none';
        img.style.webkitUserSelect = 'none';
        img.style.webkitTouchCallout = 'none';

        // 长按保存到图库
        let longPressTimer = null;
        const LONG_PRESS_DELAY = 600;

        function handleLongPress() {
            if (window.NativeBridge && typeof NativeBridge.saveImage === 'function') {
                if (confirm('是否保存二维码图片到图库？')) {
                    NativeBridge.saveImage(mergedDataURL);
                }
            } else {
                alert('保存功能暂不可用');
            }
        }

        img.addEventListener('touchstart', function(e) {
            longPressTimer = setTimeout(handleLongPress, LONG_PRESS_DELAY);
        }, { passive: true });

        img.addEventListener('touchend', function() {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }, { passive: true });

        img.addEventListener('touchmove', function() {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }, { passive: true });

        img.addEventListener('touchcancel', function() {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }, { passive: true });

        // 禁用右键/长按菜单
        img.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        const copyTip = document.createElement('span');
        copyTip.className = 'copy-success-inline';
        copyTip.textContent = '✓ 生成二维码内容已自动复制到剪贴板';

        const saveTip = document.createElement('div');
        saveTip.className = 'long-press-tip';
        saveTip.textContent = '👆 长按二维码图片可保存至图库';

        container.appendChild(img);
        container.appendChild(copyTip);
        container.appendChild(saveTip);

        resultArea.innerHTML = '';
        resultArea.appendChild(container);
    }

    // ====== 生成二维码主流程 ======
    async function generateQRCode() {
        const productLink = document.getElementById('productLink').value.trim();
        const generateBtn = document.getElementById('generateBtn');
        const resultArea = document.getElementById('resultArea');

        if (!productLink) {
            alert('请先输入商品淘口令或分享文本');
            return;
        }

        const productTitle = extractProductTitle(productLink);

        generateBtn.disabled = true;
        generateBtn.textContent = '正在解析并生成...';
        resultArea.innerHTML = '<p style="text-align:center;color:#6b7f92;">正在解析淘口令并生成，请稍候...</p>';

        // 解析商品ID
        let productId = null;
        try { productId = await parseItemIdFromShareText(productLink); } catch (e) { console.warn('淘口令解析异常:', e.message); }
        if (!productId) productId = extractProductId(productLink);

        if (!productId) {
            generateBtn.disabled = false;
            generateBtn.textContent = '生成二维码';
            resultArea.innerHTML = '<p style="color: red;text-align:center;">解析失败：无法获取商品ID</p><p style="font-size:12px;color:#999;text-align:center;">可能原因：① 网络不稳定；② 淘口令无效；③ 短链已失效。请检查后重试。</p>';
            return;
        }

        // 根据Tab生成不同链接
        let fullLink;
        if (currentTab === 'farm') {
            const replaceLinkInput = document.getElementById('replaceLink').value.trim();
            const DEFAULT_FARM_LINK = 'https://pages-g.m.taobao.com/wow/z/app/detail-next/item/index?id=1066953081383&sourceChannel=bbnc&xxc=farm&skuId=6186738814634&umpChannel=bbncdh&addressId=23116501054&spm=farm.45617361.c1.d1&x-ssr=true';
            const baseLink = replaceLinkInput || DEFAULT_FARM_LINK;
            fullLink = replaceFarmItemId(baseLink, productId);
            if (!fullLink) {
                generateBtn.disabled = false;
                generateBtn.textContent = '生成二维码';
                resultArea.innerHTML = '<p style="color: red;text-align:center;">替换失败：链接中未找到 "index?id=" 字段</p>';
                return;
            }
        } else {
            fullLink = 'https://pages-fast.m.taobao.com/wow/z/app/ltao-fe/tjb-ssr/home?activityId=100129&deliveryId=90243&sceneId=9267&spma=mspd&spmb=qdmsxiadan&itemIds=' + productId;
        }

        try {
            const qrCodeDataURL = await QRCode.toDataURL(fullLink, {
                width: 240, height: 240,
                colorDark: "#000000", colorLight: "#FFFFFF", margin: 1
            });

            let mergedDataURL;
            if (currentTab === 'farm') {
                const customText = document.getElementById('customText').value.trim();
                mergedDataURL = await createFarmQRCode(qrCodeDataURL, customText);
            } else {
                mergedDataURL = qrCodeDataURL;
            }
            currentMergedImageDataURL = mergedDataURL;

            lastCopiedLink = fullLink;
            document.getElementById('jumpCard').style.display = 'block';
            copyToClipboard(fullLink);

            showResult(productTitle, mergedDataURL);

            // 仅农场模式写入历史记录
            if (currentTab === 'farm') {
                const customText = document.getElementById('customText').value.trim();
                addHistory(customText, productTitle, fullLink);
            }
        } catch (error) {
            console.error('生成失败:', error);
            resultArea.innerHTML = '<p style="color: red;text-align:center;">生成过程中出现错误，请重试</p>';
        } finally {
            generateBtn.disabled = false;
            generateBtn.textContent = '生成二维码';
        }
    }

    // ====== 历史记录（仅农场兑换） ======
    const HISTORY_KEY = 'farm_exchange_history';
    const HISTORY_MAX = 50;

    function getHistory() {
        try {
            const data = localStorage.getItem(HISTORY_KEY);
            return data ? JSON.parse(data) : [];
        } catch (e) { return []; }
    }

    function saveHistory(list) {
        try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
    }

    function addHistory(customText, productTitle, link) {
        let list = getHistory();
        list = list.filter(item => item.link !== link);
        list.unshift({ text: customText || '', title: productTitle || '', link: link, time: Date.now() });
        if (list.length > HISTORY_MAX) list = list.slice(0, HISTORY_MAX);
        saveHistory(list);
        historyCurrentPage = 1;
        renderHistory();
    }

    function clearHistory() {
        if (!confirm('确定要清空所有历史记录吗？')) return;
        saveHistory([]);
        renderHistory();
    }

    function deleteHistory(index) {
        let list = getHistory();
        if (index < 0 || index >= list.length) return;
        list.splice(index, 1);
        saveHistory(list);
        renderHistory();
    }

    let historyCurrentPage = 1;
    const HISTORY_PAGE_SIZE = 10;

    function changeHistoryPage(delta) {
        const list = getHistory();
        const totalPages = Math.max(1, Math.ceil(list.length / HISTORY_PAGE_SIZE));
        historyCurrentPage = Math.min(Math.max(1, historyCurrentPage + delta), totalPages);
        renderHistory();
    }

    function renderHistory() {
        const list = getHistory();
        const container = document.getElementById('historyList');
        const clearBtn = document.getElementById('historyClearBtn');
        const pagination = document.getElementById('historyPagination');
        const pageInfo = document.getElementById('historyPageInfo');
        const prevBtn = document.getElementById('historyPrevBtn');
        const nextBtn = document.getElementById('historyNextBtn');

        if (list.length === 0) {
            container.innerHTML = '<div class="history-empty">暂无历史记录</div>';
            clearBtn.style.display = 'none';
            pagination.style.display = 'none';
            return;
        }
        clearBtn.style.display = 'block';

        const totalPages = Math.ceil(list.length / HISTORY_PAGE_SIZE);
        if (historyCurrentPage > totalPages) historyCurrentPage = totalPages;
        if (historyCurrentPage < 1) historyCurrentPage = 1;
        const startIndex = (historyCurrentPage - 1) * HISTORY_PAGE_SIZE;
        const pageItems = list.slice(startIndex, startIndex + HISTORY_PAGE_SIZE);

        container.innerHTML = '';

        pageItems.forEach((item, i) => {
            const globalIndex = startIndex + i;
            const div = document.createElement('div');
            div.className = 'history-item';

            const left = document.createElement('div');
            left.className = 'history-left';
            if (item.time) {
                const dateObj = new Date(item.time);
                const dateEl = document.createElement('span');
                dateEl.className = 'history-date';
                dateEl.textContent = `${dateObj.getMonth() + 1}.${dateObj.getDate()}`;
                left.appendChild(dateEl);
            }
            if (item.text) {
                const textEl = document.createElement('span');
                textEl.className = 'history-text';
                textEl.textContent = item.text;
                left.appendChild(textEl);
            }
            div.appendChild(left);

            const right = document.createElement('div');
            right.className = 'history-right';
            if (item.title) {
                const titleEl = document.createElement('div');
                titleEl.className = 'history-title';
                titleEl.textContent = item.title;
                right.appendChild(titleEl);
            }
            const linkEl = document.createElement('div');
            linkEl.className = 'history-link';
            linkEl.textContent = item.link;
            linkEl.title = '点击复制链接';
            linkEl.onclick = function() {
                copyToClipboard(item.link);
                lastCopiedLink = item.link;
                linkEl.textContent = '✓ 已复制';
                setTimeout(() => { linkEl.textContent = item.link; }, 2000);
            };
            right.appendChild(linkEl);
            div.appendChild(right);

            const actions = document.createElement('div');
            actions.className = 'history-actions';
            const shareBtn = document.createElement('button');
            shareBtn.className = 'history-share';
            shareBtn.innerHTML = '↗';
            shareBtn.title = '分享';
            shareBtn.onclick = function(e) {
                e.stopPropagation();
                const shareTitle = item.title || item.text || '农场兑换';
                shareContent(shareTitle, item.link);
            };
            actions.appendChild(shareBtn);
            const delBtn = document.createElement('button');
            delBtn.className = 'history-delete';
            delBtn.textContent = '✕';
            delBtn.title = '删除此条记录';
            delBtn.onclick = function(e) {
                e.stopPropagation();
                deleteHistory(globalIndex);
            };
            actions.appendChild(delBtn);
            div.appendChild(actions);

            container.appendChild(div);
        });

        if (totalPages > 1) {
            pagination.style.display = 'flex';
            pageInfo.textContent = `${historyCurrentPage} / ${totalPages}`;
            prevBtn.disabled = (historyCurrentPage <= 1);
            nextBtn.disabled = (historyCurrentPage >= totalPages);
        } else {
            pagination.style.display = 'none';
        }
    }

    renderHistory();
</script>
